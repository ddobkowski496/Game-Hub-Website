<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soccer Bros</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c12;color:#eef6ff;font:16px system-ui, sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}main{width:min(960px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}h1{font-size:clamp(1.4rem,4vw,2.2rem);margin:0}#score{font-weight:800;color:#69e4ff;font-size:1.2rem}p{color:#bac7d8;margin:8px 0 14px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#142c25;border:2px solid #69e4ff;border-radius:12px;touch-action:none}button{border:1px solid #69e4ff;background:#10202c;color:#effaff;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}button:hover{background:#123b4a}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;color:#9cadbf;font-size:.9rem}
</style></head><body><main><header><h1>⚽ Soccer Bros</h1><div id="score">Score: 0</div></header><p>Click in the field to aim and shoot past the moving goalie. Beat the clock.</p><canvas id="field" width="960" height="540" aria-label="Soccer Bros game area"></canvas><footer><span id="status">Ready to play</span><button id="restart">Restart</button></footer></main>
<script>
const kind='soccer', canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');
let score=0,misses=0,tick=0,keys={},playerX=480,ball={x:480,y:480,vx:0,vy:0},goalieX=480,drag=null,pitchX=-30,batSwing=0,ended=false;
const W=960,H=540;function scoreSet(){scoreEl.textContent='Score: '+score;}
function field(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#17442f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#d7f3e2';ctx.lineWidth=4;ctx.strokeRect(22,22,W-44,H-44);ctx.beginPath();ctx.moveTo(W/2,22);ctx.lineTo(W/2,H-22);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,72,0,Math.PI*2);ctx.stroke();}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function text(t,x,y,size=22,color='#fff'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y);}
function drawFootball(){field();ctx.fillStyle='#d2aa65';ctx.fillRect(70,60,820,420);ctx.strokeStyle='#fff';ctx.lineWidth=3;for(let x=100;x<880;x+=80){ctx.beginPath();ctx.moveTo(x,60);ctx.lineTo(x,480);ctx.stroke();}text('END ZONE',480,95,24);ctx.fillStyle='#46b7ff';ctx.beginPath();ctx.arc(playerX,390,25,0,Math.PI*2);ctx.fill();text('YOU',playerX,445,15);if(tick%95<52){circle(ball.x,ball.y,13,'#8c4f20');ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(ball.x-6,ball.y);ctx.lineTo(ball.x+6,ball.y);ctx.stroke();ball.y+=3.2;if(ball.y>365&&Math.abs(ball.x-playerX)<44){score+=6;scoreSet();statusEl.textContent='TOUCHDOWN! +6';ball.y=480;ball.x=80+Math.random()*800;tick=0;}else if(ball.y>455){misses++;ball.y=480;ball.x=80+Math.random()*800;statusEl.textContent=misses>0?'Next pass!':'Move and catch the pass';}}text('←  →  MOVE     SPACE  CATCH',480,520,18);}
function drawBasketball(){field();ctx.fillStyle='#b7d5e4';ctx.fillRect(745,145,10,135);ctx.strokeStyle='#ff7051';ctx.lineWidth=9;ctx.beginPath();ctx.ellipse(716,280,45,10,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#f08024';ctx.beginPath();ctx.arc(180,440,24,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(157,440);ctx.lineTo(203,440);ctx.moveTo(180,417);ctx.lineTo(180,463);ctx.stroke();if(ball.vx||ball.vy){ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.22;circle(ball.x,ball.y,16,'#ef8123');if(ball.x>680&&ball.x<750&&Math.abs(ball.y-280)<22){score++;scoreSet();statusEl.textContent='Nice shot!';ball={x:180,y:440,vx:0,vy:0};}else if(ball.x>W||ball.y>H){statusEl.textContent='Miss! Drag and release to shoot again.';ball={x:180,y:440,vx:0,vy:0};}}else circle(180,440,16,'#ef8123');if(drag){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(180,440);ctx.lineTo(drag.x,drag.y);ctx.stroke();}text('DRAG FROM THE BALL TOWARD THE HOOP',480,510,18);}
function drawSoccer(){field();ctx.fillStyle='#ddd';ctx.fillRect(388,35,184,18);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(390,34,180,90);goalieX=480+Math.sin(tick/24)*78;ctx.fillStyle='#ffd84d';ctx.fillRect(goalieX-24,84,48,22);circle(480,450,15,'#fff');ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(480,435);ctx.lineTo(480,465);ctx.stroke();if(ball.vx||ball.vy){ball.x+=ball.vx;ball.y+=ball.vy;circle(ball.x,ball.y,14,'#fff');if(ball.y<115){if(Math.abs(ball.x-goalieX)>38){score++;scoreSet();statusEl.textContent='GOAL!';}else statusEl.textContent='The keeper saved it!';ball={x:480,y:450,vx:0,vy:0};}}text('CLICK ABOVE THE BALL TO AIM AND SHOOT',480,515,18);}
function drawBaseball(){ctx.fillStyle='#244f31';ctx.fillRect(0,0,W,H);ctx.fillStyle='#b96f3f';ctx.beginPath();ctx.moveTo(480,270);ctx.lineTo(690,440);ctx.lineTo(480,525);ctx.lineTo(270,440);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(480,80);ctx.lineTo(480,480);ctx.moveTo(230,230);ctx.lineTo(730,230);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(434,360,92,68);ctx.fillStyle='#111';ctx.fillRect(442,372,76,44);ctx.fillStyle='#ef493f';ctx.fillRect(438,378,6,32);ctx.fillRect(516,378,6,32);pitchX=520+Math.sin(tick/17)*205;circle(pitchX,394,13,'#fff');circle(390,370,24,'#46b7ff');if(batSwing>0){ctx.strokeStyle='#ddb76e';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(405,365);ctx.lineTo(460,320-batSwing);ctx.stroke();batSwing=Math.max(0,batSwing-1);}text('PRESS SPACE AS THE PITCH CROSSES THE STRIKE ZONE',480,510,17);}
function loop(){tick++;if(kind==='football'){if(keys.ArrowLeft)playerX=Math.max(105,playerX-6);if(keys.ArrowRight)playerX=Math.min(855,playerX+6);drawFootball();}else if(kind==='basketball')drawBasketball();else if(kind==='soccer')drawSoccer();else drawBaseball();requestAnimationFrame(loop);}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(kind==='basketball'){drag={x,y};canvas.setPointerCapture(e.pointerId);}else if(kind==='soccer'){if(!ball.vx&&!ball.vy){ball={x:480,y:450,vx:(x-480)/24,vy:(Math.min(y,390)-450)/24};statusEl.textContent='Shot taken!';}}});
canvas.addEventListener('pointerup',e=>{if(kind==='basketball'&&drag){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;ball={x:180,y:440,vx:Math.max(3,Math.min(12,(x-180)/18)),vy:Math.max(-12,Math.min(-3,(y-440)/18))};drag=null;statusEl.textContent='Shot in the air!';}});
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();if(kind==='football')statusEl.textContent='Keep moving under the pass!';if(kind==='baseball'){batSwing=18;if(Math.abs(pitchX-480)<72){score++;scoreSet();statusEl.textContent='HIT! Great timing.';}else{misses++;statusEl.textContent='Strike! Watch the pitch.';}}}});window.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('restart').onclick=()=>{score=0;misses=0;tick=0;playerX=480;ball={x:480,y:480,vx:0,vy:0};scoreSet();statusEl.textContent='Ready to play';};loop();
</script></body></html>
